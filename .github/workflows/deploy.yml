name: Build on GitHub and Deploy to EC2

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish .NET App
      run: dotnet publish LeaveManagementSystem/LeaveManagementSystem.csproj -c Release -o ./publish

    - name: Copy compiled app to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "publish/*,Dockerfile,docker-compose.yml"
        target: "~/LeaveManagementSystem"

    - name: Start Containers on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/LeaveManagementSystem
          docker image prune -af
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}" docker compose up -d --build
