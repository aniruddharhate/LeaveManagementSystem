services:
  db:
    image: ://microsoft.com
    container_name: leave-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    image: ://microsoft.com
    working_dir: /src/LeaveManagementSystem
    volumes:
      - .:/src
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LeaveDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
    command: >
      bash -c "dotnet tool install --global dotnet-ef --version 8.0.0 &&
               export PATH=\"$$PATH:/root/.dotnet/tools\" &&
               dotnet ef database update"

  webapp:
    build: .
    container_name: leave-webapp
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LeaveDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"

volumes:
  sql_data:
