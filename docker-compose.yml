services:
  webapp:
    build: .
    container_name: leave-webapp
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - app_data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/LeaveDB.sqlite"

volumes:
  app_data:
